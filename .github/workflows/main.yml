name: Build My Next App

on:
  push:
    branches: [ main ]

jobs:
  build-next-app:
    runs-on: redhat-latest
    concurrency: 
      group: deploy
      cancel-in-progress: true

    steps:
      - name: checkout Repository 
        uses: actions/checkout@v7
      - name: setup Node JS   
        uses: actions/setup-node@v7.1.0
        with:
          node-version: v24.12.0
          cache: 'npm'
      - name: Install Dependencies  
        run: npm install
      - name: Build Next App
        run: npm run build
      - name: upload Build on Artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
            name: nextjs-build
            path: out/
